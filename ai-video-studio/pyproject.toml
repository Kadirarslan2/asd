[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-studio"
version = "0.1.0"
description = "Modüler AI video prodüksiyon hattı: senaryo → storyboard → video (Runway/Kling/Veo) → ses (ElevenLabs) → kurgu (FFmpeg)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.80"]
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:app"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
